name: Verify Podoco

on:
  push:
    paths: ['podoco/**', '.github/workflows/podoco.yml']
  pull_request:
    paths: ['podoco/**', '.github/workflows/podoco.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Rust, C, and Dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: podoco
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Check APIs, generated header, and relocated Dart package
        run: python tools/dev.py check
      - name: Core ML observer exclusion and same-process loading
        if: runner.os == 'macOS'
        run: |
          cargo clippy --locked --workspace --all-targets --features coreml -- -D warnings
          python tools/check_coreml.py

  generated:
    name: Generated C and Dart bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: podoco
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: python tools/dev.py check-generated

  rust-minimum:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: podoco
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 test --locked -p podoco -p podoco-ffi
