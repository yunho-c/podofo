[package]
name = "podoco"
description = "Rust-owned document analysis with ergonomic language bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
coreml = ["dep:cidre"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
cidre = { workspace = true, optional = true }

[[example]]
name = "coreml_probe"
crate-type = ["cdylib"]
required-features = ["coreml"]

[lints]
workspace = true
