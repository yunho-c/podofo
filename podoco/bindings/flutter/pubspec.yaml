name: podoco_flutter
description: Offline, app-bundled model resources for the Podoco Rust SDK.
version: 0.1.0
publish_to: none
repository: https://github.com/yunho-c/podofo
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  podoco:
    path: ../dart
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: PodocoFlutterPlugin
